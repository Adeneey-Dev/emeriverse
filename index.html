<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/feather.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Emeriverse - A Universe of Learning. Explore Ifeanyi Emeribe's Easy Learning Flash Cards: books on English grammar, idioms, vocabulary, and general knowledge for learners of every age."
    />
    <meta name="theme-color" content="#12100E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Emeriverse - A Universe of Learning by Ifeanyi Emeribe</title>
        <script>
      (function () {
        try {
          var stored = window.sessionStorage.getItem("theme");
          if (stored === "dark") {
            document.documentElement.classList.add("dark");
          }
          // Uses sessionStorage (not localStorage) on purpose: it
          // survives a page refresh within the same tab/session, but
          // clears automatically once the tab or browser closes - so
          // every fresh visit always starts on light, while refreshing
          // mid-visit keeps whichever theme you were already on.
        } catch (e) {
          // sessionStorage can throw in restricted/private contexts;
          // default to light in that case too.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
